spring:
  application:
    name: ai-learning-platform
  servlet:
    multipart:
      # Module 2: invoice photos from phones can be several MB. Give uploads headroom.
      max-file-size: 15MB
      max-request-size: 20MB
  # ---------------------------------------------------------------------------
  # Module 3 — Postgres + pgvector for embedding storage & semantic search.
  # Start Postgres:  docker compose up -d
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_learning
    username: ailearning
    password: ailearning
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

server:
  port: 8080

# ---------------------------------------------------------------------------
# Module 0 — where the model lives.
# Point this at your local Ollama. Nothing here ever leaves your machine:
# that is the whole reason we run inference locally (privacy / cost / control).
# ---------------------------------------------------------------------------
ollama:
  base-url: http://localhost:11434
  # qwen2.5-coder:7b is the daily driver. Swap to :14b for max quality,
  # or llama3.2:3b for fast smoke tests.
  model: qwen2.5-coder:7b
  connect-timeout: 5s
  # LLM calls are slow; give the read a generous budget.
  read-timeout: 120s

# ---------------------------------------------------------------------------
# Module 1 — how we make extraction reliable & reproducible.
# ---------------------------------------------------------------------------
invoice:
  extraction:
    # Lets you route invoice extraction to a different (e.g. stronger) model
    # than the default chat model without touching code.
    model: ${ollama.model}
    # Module 2: the multimodal model used for image/photo extraction.
    # Must accept images. Pull it first:  ollama pull llama3.2-vision
    vision-model: llama3.2-vision
    # temperature 0 => greedy decoding => as deterministic as the model gets.
    # For *extraction* we never want creativity.
    temperature: 0.0
    # A fixed seed + temperature 0 makes runs reproducible (great for tests/debugging).
    seed: 42
    # Context window the model is allowed to use. Big invoices need headroom.
    num-ctx: 8192
    # "auto-retry once": 1 retry => up to 2 attempts total.
    max-retries: 1

# ---------------------------------------------------------------------------
# Module 3 — embeddings & semantic search.
# ---------------------------------------------------------------------------
embedding:
  # Embedding model. Pull it first:  ollama pull nomic-embed-text
  model: nomic-embed-text
  # nomic-embed-text outputs 768-dimensional vectors. Must match schema.sql.
  dimensions: 768
  # Chunking params: how to split documents before embedding.
  # Smaller chunks = more precise retrieval; larger = more context per hit.
  chunk-size: 500
  # Overlap keeps context at chunk boundaries.
  chunk-overlap: 100

# ---------------------------------------------------------------------------
# Module 4 — RAG (retrieval-augmented generation).
# ---------------------------------------------------------------------------
rag:
  # Chat model that writes the grounded answer.
  chat-model: ${ollama.model}
  # Low temperature: we want faithful answers from the context, not creativity.
  temperature: 0.1
  seed: 42
  # Big context window — RAG stuffs several chunks plus the question.
  num-ctx: 8192
  # How many chunks end up in the prompt (after re-ranking).
  top-k: 4
  # Larger candidate pool retrieved before re-ranking (over-fetch).
  fetch-k: 20
  # MMR re-ranking for relevance + diversity (set false to take top-k by similarity).
  rerank: true
  # MMR balance: 1.0 = pure relevance, 0.0 = pure diversity.
  mmr-lambda: 0.6
  # Context budget in characters (~4 chars/token). Keeps us inside the window.
  max-context-chars: 6000

# ---------------------------------------------------------------------------
# Module 5 — tool-calling agent.
# Needs a tool-capable model (Qwen2.5, Llama 3.1+). qwen2.5-coder:7b works well.
# ---------------------------------------------------------------------------
agent:
  model: ${ollama.model}
  # Deterministic tool selection — we don't want creativity when picking tools.
  temperature: 0.0
  seed: 42
  num-ctx: 8192
  # Safety cap on the agentic loop so a confused model can't loop forever.
  max-iterations: 5

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.dileep.ailearning: INFO
